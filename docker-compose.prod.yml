# Full stack for a VPS / Oracle Cloud / any host with Docker.
# Usage:
#   copy .env.example → .env  (fill secrets + public URLs)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Browser must reach API at NEXT_PUBLIC_API_URL (often http://YOUR_IP:8000/api/v1).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - humanizr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_SERVICE_URL: http://queue:3030
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  queue:
    build:
      context: ./queue
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:8000
      QUEUE_HTTP_PORT: "3030"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3030/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  humanizr_redis_data:

networks:
  default:
    name: humanizr-network
