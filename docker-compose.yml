version: "3.9"

# Local dev compose (API + frontend). For Redis + queue use:
#   docker run -d -p 6380:6379 --name humanizr-redis redis:7-alpine
#   cd queue && npm run dev
# Full stack on one machine: docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional split AI microservice: docker compose --profile ai-split up
  ai:
    profiles: ["ai-split"]
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped

networks:
  default:
    name: humanizr-network
